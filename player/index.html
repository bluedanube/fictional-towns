<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>また、あした — 試作プレーヤー</title>
<style>
:root{--ink:#f4efe6;--panel:rgba(14,18,32,.82);--edge:rgba(255,255,255,.22);--accent:#9fc4e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#bg,#tint{position:absolute;inset:0}
#bg{background-size:cover;background-position:center;transition:background .4s}
#bgnote{position:absolute;left:50%;top:38%;transform:translateX(-50%);opacity:.55;font-size:14px;text-align:center;display:none;padding:6px 10px;border:1px dashed var(--edge)}
.sprite{position:absolute;bottom:0;height:78%;aspect-ratio:2/3;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.sprite img{height:100%;width:100%;object-fit:contain;object-position:bottom}
.sprite .ph{width:100%;height:100%;border:2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:14px;line-height:1.6;border-radius:6px 6px 0 0}
#box{position:absolute;left:2.5%;right:2.5%;bottom:calc(2% + env(safe-area-inset-bottom));min-height:26%;max-height:46%;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
#box.hide{display:none}
#icon{flex:0 0 auto;width:72px;height:72px;border:1px solid var(--edge);background:#222;display:none;overflow:hidden;font-size:11px;text-align:center}
#icon img{width:100%;height:100%;object-fit:cover}
#icon .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08)}
#tx{flex:1;min-width:0}
#name{font-size:14px;color:var(--accent);min-height:1.2em;margin-bottom:4px;letter-spacing:.1em}
#text{font-size:clamp(16px,2.4vmin,22px);line-height:1.9;white-space:pre-wrap;overflow:auto;max-height:100%}
#next{position:absolute;right:14px;bottom:8px;font-size:12px;opacity:.7;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.1}}
#bar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
#bar button,.btn{background:rgba(14,18,32,.7);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font:13px inherit;font-family:inherit;cursor:pointer}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;font-size:12px;opacity:.7;line-height:1.5;z-index:5}
.overlay{position:absolute;inset:0;background:rgba(6,8,16,.9);z-index:10;display:none;overflow:auto;padding:16px}
.overlay.show{display:block}
.overlay h2{margin:0 0 12px;font-size:18px;font-weight:normal}
.overlay .close{position:sticky;top:0;float:right}
#log p{margin:0 0 10px;line-height:1.8}
#log .n{color:var(--accent);font-size:13px;display:block}
#title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.45);text-align:center;cursor:pointer;z-index:4}
#title.show{display:flex}
#title .c{font-size:13px;letter-spacing:.3em;opacity:.8}
#title .t{font-size:clamp(24px,6vmin,44px);margin-top:12px;letter-spacing:.15em}
#choice{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.5);z-index:6;padding:16px}
#choice.show{display:flex}
#choice .btn{font-size:17px;padding:12px 22px;min-width:min(80vw,320px)}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px}
/* 絵本 */
#book .spread{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:1100px;margin:8px auto;background:#f6f0e4;color:#2a2418;border-radius:6px;overflow:hidden;min-height:60vh}
#book .L{position:relative;background-size:cover;background-position:center;min-height:240px;display:flex;align-items:flex-end;justify-content:center}
#book .L .ph{margin:auto;padding:8px 12px;border:1px dashed rgba(0,0,0,.4);font-size:13px;background:rgba(255,255,255,.4)}
#book .R{padding:28px 30px;display:flex;flex-direction:column;justify-content:center}
#book .R h3{margin:0 0 18px;font-weight:normal;letter-spacing:.2em;font-size:20px}
#book .R p{margin:0 0 14px;font-size:clamp(16px,2.2vmin,21px);line-height:2}
#book .nav{display:flex;justify-content:center;gap:10px;margin:10px 0;align-items:center}
@media (max-aspect-ratio:1/1),(max-width:640px){
 #book .spread{grid-template-columns:1fr}
 #book .L{min-height:34vh}
 #book .R{padding:18px}
 .sprite{height:62%}
 #box{min-height:30%;max-height:50%;padding:10px 12px}
 #icon{width:56px;height:56px}
 #text{line-height:1.8}
}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="tint"></div><div id="bgnote"></div>
  <div id="sprites"></div>
  <div id="hud"></div>
  <div id="bar">
    <button id="bChap">章</button><button id="bLog">ログ</button><button id="bBook">絵本</button><button id="bRoster" style="display:none">名簿</button>
  </div>
  <div id="box"><div id="icon"></div><div id="tx"><div id="name"></div><div id="text"></div></div><div id="next">▼</div></div>
  <div id="title"><div class="c"></div><div class="t"></div></div>
  <div id="choice"></div>
  <div id="log" class="overlay"><button class="btn close" data-close>閉じる</button><h2>ログ</h2><div id="logbody"></div></div>
  <div id="chap" class="overlay menu"><button class="btn close" data-close>閉じる</button><h2>章を選ぶ</h2><div id="chapbody"></div></div>
  <div id="book" class="overlay"><button class="btn close" data-close>閉じる</button><h2>絵本表示</h2><div id="bookbody"></div></div>
  <div id="roster" class="overlay"><button class="btn close" data-close>閉じる</button><h2>名簿</h2><div id="rosterbody"></div></div>
</div>
<script src="script-data.js" onerror="void 0"></script>
<script src="sample/sample.js" onerror="void 0"></script>
<script>
"use strict";
(function(){
var $=function(id){return document.getElementById(id)};
var ASSET="../assets/";
var ROMAJI={"U3C-01":"toki","U3V2-03":"rabi","U3C-08":"ruri","U3V2-01":"hoshi","U3C-03":"mio","U3V2-07":"nui","F2C-02":"kii","F2C-14":"lila"};
var GIRLS={"U3C-01":"トキ","U3V2-03":"ラビ","U3C-08":"ルリ","U3V2-01":"ホシ","U3C-03":"ミオ","U3V2-07":"ヌイ","F2C-02":"キイ","F2C-14":"リラ"};
var RES={"U3-01":"時田 秋夫","U3-02":"針生 幸","U3-05":"灯谷 昭","U3-06":"黒澤 峻","U3-07":"三瀬 絹","U3-08":"野上 青","U3-12":"遠野 礼子","U3-14":"片桐 志保","U3-16":"井口 宗一","F2-01":"柊 恭一","F2-03":"小池 千代","F2-10":"和田 光","F2-14":"瀬尾 ゆり"};
var GRAD={dusk:"linear-gradient(#e8dcc8,#b19a7c)",night:"linear-gradient(#1b2a44,#0a0f1e)"};
var TINT={dusk:"rgba(255,215,160,.10)",night:"rgba(8,22,60,.38)"};
var POS={left:"20%",center:"50%",right:"80%"};
var SPEED=38, NEED=8;

var forceRoster=false, debug=false, data=null, steps=[], pos=0, typing=null, threads=0, hasChoice=false, lastScene=null, audio={bgm:null,bgmName:null};

function show(el,on){el.classList[on?"add":"remove"]("show")}
function ph(cls,label){var d=document.createElement("div");d.className=cls||"ph";d.textContent=label;return d}

function load(){
  if(window.NOVEL&&window.NOVEL.chapters&&window.NOVEL.chapters.length){return Promise.resolve(window.NOVEL)}
  var ids=["ch00","ch01","ch02","ch03","ch04","ch05","ch06","ch07","ch08","ch99"];
  return Promise.all(ids.map(function(i){return fetch("../script/"+i+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}))
   .then(function(list){list=list.filter(Boolean);if(list.length)return {chapters:list,roster:[]};throw 0})
   .catch(function(){return window.SAMPLE||{chapters:[],roster:[]}});
}

function build(){
  steps=[];
  data.chapters.forEach(function(ch,ci){
    steps.push({k:"title",ci:ci});
    (ch.scenes||[]).forEach(function(sc,si){
      (sc.lines||[]).forEach(function(l,li){steps.push({k:"line",ci:ci,si:si,li:li,l:l})});
      if(sc.choice&&sc.choice.enabled){hasChoice=true;steps.push({k:"choice",ci:ci,si:si,done:false})}
    });
  });
}

function scene(s){return data.chapters[s.ci].scenes[s.si||0]}

function setBg(sc,note){
  var bg=$("bg"),n=$("bgnote");n.style.display="none";
  bg.style.background=GRAD[sc.time]||GRAD.dusk;
  $("tint").style.background=TINT[sc.time]||"transparent";
  if(sc.bg_missing||!sc.bg){n.textContent="背景なし："+(sc.bg||"");n.style.display="block";return}
  var url=ASSET+"images/"+sc.bg+".webp",im=new Image();
  im.onload=function(){bg.style.background="url('"+url+"') center/cover"};
  im.onerror=function(){n.textContent="背景なし："+sc.bg;n.style.display="block"};
  im.src=url;
}

function setSprite(s){
  var host=$("sprites");host.innerHTML="";
  var cur=null;
  for(var i=pos;i>=0;i--){var t=steps[i];if(t.ci!==s.ci||t.si!==s.si||t.k==="title")break;if(t.k==="line"&&t.l.sprite){cur=t.l;break}}
  if(!cur)return;
  var sp=cur.sprite,box=document.createElement("div");box.className="sprite";box.style.left=POS[sp.pos]||"50%";
  var label=(GIRLS[cur.who]||cur.who)+"\n"+sp.pose+" / "+sp.face;
  if(cur.missing){box.appendChild(ph("ph",label));host.appendChild(box);return}
  var img=new Image();img.alt="";
  img.onerror=function(){box.innerHTML="";box.appendChild(ph("ph",label))};
  img.src=ASSET+"sprites/"+cur.who+"-"+(ROMAJI[cur.who]||"x")+"/"+sp.pose+"_"+sp.face+".webp";
  box.appendChild(img);host.appendChild(box);
}

function setIcon(l){
  var el=$("icon");el.innerHTML="";
  if(!l.icon){el.style.display="none";return}
  el.style.display="block";
  var label=RES[l.icon]||l.icon;
  if(l.missing){el.appendChild(ph("ph",label));return}
  var img=new Image();img.alt=label;
  img.onerror=function(){el.innerHTML="";el.appendChild(ph("ph",label))};
  img.src=ASSET+"images/u-town-3-residents/"+l.icon+".gif";
  el.appendChild(img);
}

function who(l){
  if(l.who==="narr")return "";
  return GIRLS[l.who]||RES[l.who]||l.who;
}

function playAudio(sc){
  try{
    var b=sc.bgm||null;
    if(b!==audio.bgmName){
      if(audio.bgm){audio.bgm.pause();audio.bgm=null}
      audio.bgmName=b;
      if(b){var a=new Audio(ASSET+"audio/bgm/"+b+".ogg");a.loop=true;a.volume=.5;a.onerror=function(){};var p=a.play();if(p&&p.catch)p.catch(function(){});audio.bgm=a}
    }
    (sc.se||[]).forEach(function(n){var a=new Audio(ASSET+"audio/se/"+n+".ogg");a.volume=.5;a.onerror=function(){};var p=a.play();if(p&&p.catch)p.catch(function(){})});
  }catch(e){}
}

function stopType(){if(typing){clearInterval(typing.t);typing=null}}

function render(animate){
  stopType();
  var s=steps[pos];
  $("choice").innerHTML="";show($("choice"),false);
  var ch=data.chapters[s.ci];
  var sc=scene(s);
  setBg(sc);
  var key=s.ci+":"+(s.si||0);
  if(key!==lastScene){lastScene=key;if(animate)playAudio(sc)}
  $("hud").textContent=ch.title+(hasChoice?"　糸 "+threads:"")+(debug&&(sc.bgm||(sc.se&&sc.se.length))?"\n♪ "+[sc.bgm].concat(sc.se||[]).filter(Boolean).join(" / "):"");
  $("hud").style.whiteSpace="pre";
  $("bRoster").style.display=((hasChoice&&threads>=NEED)||forceRoster)?"":"none";
  if(s.k==="title"){
    $("sprites").innerHTML="";$("box").classList.add("hide");
    var t=$("title");t.querySelector(".c").textContent=ch.id==="ch00"?"序":ch.id==="ch99"?"終":"第"+parseInt(ch.id.slice(2),10)+"章";
    t.querySelector(".t").textContent=ch.title;show(t,true);return;
  }
  show($("title"),false);$("box").classList.remove("hide");
  setSprite(s);
  if(s.k==="choice"){
    $("box").classList.add("hide");
    var c=sc.choice,w=$("choice");
    var p=document.createElement("div");p.textContent=c.prompt||"どこを見る?";p.style.fontSize="18px";w.appendChild(p);
    c.options.forEach(function(o){var b=document.createElement("button");b.className="btn";b.textContent=o.label;b.onclick=function(e){e.stopPropagation();pick(s,o)};w.appendChild(b)});
    show(w,true);return;
  }
  var l=s.l;
  setIcon(l);
  $("name").textContent=who(l);
  var tx=$("text");tx.textContent="";
  var full=l.text||"";
  if(!animate){tx.textContent=full;return}
  var i=0;typing={full:full,t:setInterval(function(){i++;tx.textContent=full.slice(0,i);if(i>=full.length)stopType()},SPEED)};
}

function pick(s,o){
  s.done=true;threads+=(o.thread||0);
  var add=(o.lines||[]).map(function(l,li){return {k:"line",ci:s.ci,si:s.si,li:-1,l:l}});
  var idx=steps.indexOf(s);
  steps.splice.apply(steps,[idx+1,0].concat(add));
  next();
}

function skipDone(dir){while(steps[pos]&&steps[pos].k==="choice"&&steps[pos].done)pos+=dir}

function next(){
  if(typing){var f=typing.full;stopType();$("text").textContent=f;return}
  if(steps[pos].k==="choice"&&!steps[pos].done)return;
  if(pos>=steps.length-1){ending();return}
  pos++;skipDone(1);render(true);
}
function prev(){
  if(pos<=0)return;
  pos--;skipDone(-1);if(pos<0)pos=0;
  render(false);
}
function ending(){
  var s=steps[pos];
  if((hasChoice&&threads>=NEED)||forceRoster){openRoster();return}
  $("name").textContent="";$("text").textContent="（おわり）";
}

function openLog(){
  var b=$("logbody");b.innerHTML="";
  for(var i=0;i<=pos;i++){
    var s=steps[i];
    if(s.k==="title"){var h=document.createElement("p");h.style.opacity=".7";h.textContent="── "+data.chapters[s.ci].title+" ──";b.appendChild(h)}
    else if(s.k==="line"){var p=document.createElement("p");if(who(s.l)){var n=document.createElement("span");n.className="n";n.textContent=who(s.l);p.appendChild(n)}p.appendChild(document.createTextNode(s.l.text));b.appendChild(p)}
  }
  show($("log"),true);$("log").scrollTop=1e9;
}
function openChap(){
  var b=$("chapbody");b.innerHTML="";
  data.chapters.forEach(function(ch,ci){
    var bt=document.createElement("button");bt.className="btn";bt.textContent=ch.id+"　"+ch.title;
    bt.onclick=function(){pos=steps.findIndex(function(s){return s.k==="title"&&s.ci===ci});lastScene=null;show($("chap"),false);render(true)};
    b.appendChild(bt);
  });
  show($("chap"),true);
}
var bookIdx=0;
function openBook(i){
  bookIdx=Math.max(0,Math.min(data.chapters.length-1,i==null?bookIdx:i));
  var ch=data.chapters[bookIdx],b=$("bookbody");b.innerHTML="";
  var lines=[];(ch.scenes||[]).forEach(function(sc){(sc.lines||[]).forEach(function(l){if(l.book)lines.push(l)})});
  var sp=document.createElement("div");sp.className="spread";
  var L=document.createElement("div");L.className="L";
  var sc0=(ch.scenes||[])[0]||{};
  L.style.background=GRAD[sc0.time]||GRAD.dusk;
  if(!sc0.bg_missing&&sc0.bg){var im=new Image(),u=ASSET+"images/"+sc0.bg+".webp";im.onload=function(){L.style.background="url('"+u+"') center/cover"};im.onerror=function(){L.appendChild(ph("ph","背景なし："+sc0.bg))};im.src=u}
  else L.appendChild(ph("ph","背景なし："+(sc0.bg||"")));
  var R=document.createElement("div");R.className="R";
  var h=document.createElement("h3");h.textContent=ch.title;R.appendChild(h);
  lines.forEach(function(l){var p=document.createElement("p");p.textContent=l.text;R.appendChild(p)});
  sp.appendChild(L);sp.appendChild(R);b.appendChild(sp);
  var nav=document.createElement("div");nav.className="nav";
  var a=document.createElement("button");a.className="btn";a.textContent="◀ 前";a.onclick=function(){openBook(bookIdx-1)};
  var z=document.createElement("button");z.className="btn";z.textContent="次 ▶";z.onclick=function(){openBook(bookIdx+1)};
  var c=document.createElement("span");c.textContent=(bookIdx+1)+" / "+data.chapters.length;
  nav.appendChild(a);nav.appendChild(c);nav.appendChild(z);b.appendChild(nav);
  show($("book"),true);
}
function openRoster(){
  var b=$("rosterbody");b.innerHTML="";
  (data.roster||[]).forEach(function(g){var p=document.createElement("p");p.textContent=g.name+"（"+g.ornament+"）　"+g.magic;b.appendChild(p)});
  if(!(data.roster||[]).length)b.textContent="名簿のデータがありません。";
  show($("roster"),true);
}
function anyOverlay(){return ["log","chap","book","roster"].some(function(i){return $(i).classList.contains("show")})}
function closeAll(){["log","chap","book","roster"].forEach(function(i){show($(i),false)})}

function start(d){
  data=d;build();
  if(!steps.length){$("text").textContent="台本がありません。";return}
  $("box").onclick=next;$("title").onclick=next;$("bg").onclick=next;$("sprites").onclick=next;
  $("bLog").onclick=function(e){e.stopPropagation();openLog()};
  $("bChap").onclick=function(e){e.stopPropagation();openChap()};
  $("bBook").onclick=function(e){e.stopPropagation();openBook()};
  $("bRoster").onclick=function(e){e.stopPropagation();openRoster()};
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"),function(b){b.onclick=closeAll});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){closeAll();return}
    if(anyOverlay()){
      if($("book").classList.contains("show")){if(e.key==="ArrowRight")openBook(bookIdx+1);if(e.key==="ArrowLeft")openBook(bookIdx-1)}
      return;
    }
    if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();next()}
    else if(e.key==="Backspace"||e.key==="ArrowLeft"){e.preventDefault();prev()}
    else if(e.key==="l"||e.key==="L")openLog();
    else if(e.key==="b"||e.key==="B")openBook();
  });
  // ?ch=3 や #ch03 で章から始める。?book=1 で絵本表示から。
  var q=location.search+location.hash;forceRoster=/roster=1/.test(q);debug=/debug=1/.test(q);var m=q.match(/ch=?0?(\d+)/);
  if(m){var want="ch"+("0"+m[1]).slice(-2);var ci=data.chapters.findIndex(function(c){return c.id===want});if(ci>=0)pos=steps.findIndex(function(s){return s.k==="title"&&s.ci===ci})}
  render(true);
  if(/book=1/.test(q))openBook(0);
}
load().then(start);
})();
</script>
</body>
</html>
